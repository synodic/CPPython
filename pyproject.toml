[project]
description = "A Python management solution for C++ dependencies"
name = "cppython"

license = {text = "MIT"}

authors = [
  {name = "Synodic Software", email = "contact@synodic.software"},
]
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.12"

dependencies = [
  "typer>=0.12.4",
  "tomlkit>=0.13.2",
  "pydantic>=2.8.2",
  "packaging>=24.1",
]

[project.license-files]
paths = ["LICENSE.md"]

[project.urls]
homepage = "https://github.com/Synodic-Software/CPPython"
repository = "https://github.com/Synodic-Software/CPPython"

# [project.entry-points."cppython.scm"]
# mock = "pytest_cppython.mock.scm:MockSCM"

# [project.entry-points."cppython.generator"]
# mock = "pytest_cppython.mock.generator:MockGenerator"

# [project.entry-points."cppython.provider"]
# mock = "pytest_cppython.mock.provider:MockProvider"

# [project.entry-points.pytest11]
# pytest_cppython = "pytest_cppython.plugin"

# Plugin registration
[project.entry-points."cppython.scm"]
git = "cppython_git.plugin:GitSCM"

[project.entry-points."cppython.generator"]
cmake = "cppython_cmake.plugin:CMakeGenerator"

[project.entry-points.pdm]
cppython = "cppython_pdm.plugin:CPPythonPlugin"

[project.entry-points."cppython.provider"]
vcpkg = "cppython_vcpkg.plugin:VcpkgProvider"

[tool.pdm.options]
update = ["--update-all"]

[tool.pdm.version]
source = "scm"

[tool.pdm.dev-dependencies]
lint = [
  "black>=24.2.0",
  "pylint>=3.2.4",
  "isort>=5.13.2",
  "mypy>=1.11",
]
test = [
  "pytest>=8.0.2",
  "pytest-cov>=4.1.0",
  "pytest-click>=1.1",
  "pytest-mock>=3.12.0",
]

[project.scripts]
cppython = "cppython.console.interface:cli"

[tool.pdm.scripts]
analyze = {shell = "pylint --verbose cppython tests"}
format = {shell = "black --check --verbose ."}
lint = {composite = ["analyze", "format", "sort-imports", "type-check"]}
sort-imports = {shell = "isort --check-only --diff --verbose ."}
test = {shell = "pytest --cov=cppython --verbose tests"}
type-check = {shell = "mypy ."}

[tool.pytest.ini_options]
log_cli = true
testpaths = [
  "tests",
]

[tool.black]
line-length = 120
preview = true

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
exclude = "__pypackages__"
plugins = ["pydantic.mypy"]
strict = true

[tool.pylint.MAIN]
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint.extensions.docstyle",
  "pylint.extensions.docparams",
  "pylint.extensions.private_import",
  "pylint.extensions.bad_builtin",
]

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.parameter_documentation]
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false
default-docstring-type = "google"

[tool.coverage.report]
skip_empty = true

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
