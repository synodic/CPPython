name: Build Documentation
on:
  push: 
    paths:
      - docs/**
    branches: 
      - '**'

jobs:
  publish_release:
    if: github.repository_owner == 'synodic'
    uses: synodic/.github/.github/workflows/documentation-trigger.yml@stable
    with:
        repository: synodic/CPPython-Website
    secrets:
        PAT: ${{ secrets.CPPYTHON_DOC_PAT }}