[project]
description = "A simple project showing how to use vcpkg with CPPython"
name = "cppython-vcpkg-cmake-simple"
version = "1.0.0"

license = { text = "MIT" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]

requires-python = ">=3.14"

dependencies = ["cppython[vcpkg, cmake, git]>=0.9.0"]


[tool.cppython]
install-path = "install"

dependencies = ["fmt>=12.1.0"]

[tool.cppython.generators.cmake]
cmake_binary = "C:/Program Files/CMake/bin/cmake.exe"

[tool.cppython.providers.vcpkg]

[tool.pdm]
distribution = false
